# Preserve complete modified-key escape sequences without a perceptible Vim delay.
set -s escape-time 0
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys:hyperlinks:osc7:sync:overline:usstyle:progressbar'

set -g focus-events on
set -g mouse on
set -g history-limit 50000

# Use Vim shortcuts
set -g mode-keys vi
set -g status-keys vi

set -g default-terminal "tmux-256color"
set -g allow-set-title on

set -g base-index 1 # start windows numbering from 1
set -g pane-base-index 1 # start pane numbering from 1
set -g renumber-windows on

set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind - split-window -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

#### STATUS BAR - Solarized Light

set -g status-position top
set -g status-interval 5
set -g status-justify left

# Main status bar
set -g status-style "bg=#eee8d5,fg=#657b83"

# Left: session name. Turns orange while the tmux prefix is active.
set -g status-left-length 30
set -g status-left '#{?client_prefix,#[bg=#cb4b16],#[bg=#268bd2]}#[fg=#fdf6e3,bold] #S #[bg=#eee8d5,fg=#657b83,nobold] '

# Windows
set -g window-status-separator ""
set -g window-status-format "#[bg=#eee8d5,fg=#839496] #I:#{=/20/...:pane_title} "
set -g window-status-current-format "#[bg=#2aa198,fg=#fdf6e3,bold] #I:#{=/32/...:pane_title} #[bg=#eee8d5,fg=#657b83,nobold]"

# Right: current directory and time
set -g status-right-length 80
set -g status-right "#[fg=#93a1a1]#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}  #[fg=#657b83,bold]%H:%M "

# Pane borders
set -g pane-border-style "fg=#93a1a1"
set -g pane-active-border-style "fg=#2aa198"

# tmux messages
set -g message-style "fg=#fdf6e3,bg=#cb4b16,bold"

# Pane-number overlay (prefix + q)
set -g display-panes-colour "#cb4b16"
set -g display-panes-active-colour "#268bd2"

# Clock mode
set -g clock-mode-colour "#859900"

# Bell
set -g window-status-bell-style "fg=#fdf6e3,bg=#dc322f,bold"
